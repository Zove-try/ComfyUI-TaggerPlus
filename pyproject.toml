[project]
name = "comfyui-taggerplus"
version = "0.1.5"
description = "Fixed WD14 / PixAI tagger nodes for ComfyUI: cached ONNX sessions, visible device reporting, dropdown model selection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "onnxruntime-gpu>=1.17",
    "safetensors>=0.4",
    "timm>=0.9",
]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Homepage = "https://github.com/Zove-try/ComfyUI-TaggerPlus"
Repository = "https://github.com/Zove-try/ComfyUI-TaggerPlus"
Issues = "https://github.com/Zove-try/ComfyUI-TaggerPlus/issues"

[tool.comfy]
PublisherId = "zove-try"
DisplayName = "Tagger Plus (WD14 / PixAI)"
Icon = "https://raw.githubusercontent.com/Zove-try/ComfyUI-TaggerPlus/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/Zove-try/ComfyUI-TaggerPlus/main/assets/cover.png"
